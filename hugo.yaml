baseURL: /
title: Dresdner Stadtteile

contentDir: content
defaultContentLanguage: de
defaultContentLanguageInSubdir: false
enableMissingTranslationPlaceholders: true
enableRobotsTXT: true
enableGitInfo: true

languages:
  de:
    locale: de-DE
    direction: ltr
    label: Deutsch
    weight: 1

taxonomies:
  tag: tags
  category: categories

module:
  proxy: direct
  imports:
    - path: github.com/google/docsy

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
    renderer:
      unsafe: true
  highlight:
    style: tango

params:
  privacy_policy: /datenschutz
  impressum: /impressum

  offlineSearch: true
  offlineSearchSummaryLength: 200

  taxonomy:
    taxonomyCloud:
      - tags
      - categories
    taxonomyCloudTitle:
      - Tag Cloud
      - Categories
    taxonomyPageHeader:
      - tags
      - categories

  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    sidebar_search_disable: false
    sidebar_menu_compact: true
    ul_show: 0
    sidebar_menu_foldable: true
    sidebar_cache_limit: 1000
    footer_about_enable: true
    feedback:
      enable: false
      "yes": Glad to hear it! Please <a
        href="https://github.com/albig/dresdens-stadtteile/issues/new">tell us how we
        can improve</a>.
      "no": Sorry to hear that. Please <a
        href="https://github.com/albig/dresdens-stadtteile/issues/new">tell us how we
        can improve</a>.
    readingtime:
      enable: false

  links:
    developer:
      - name: GitHub
        url: https://github.com/albig/dresdens-stadtteile
        icon: fab fa-github
        desc: Development takes place here!
    user:
      - name: Mastodon
        url: https://gruene.social/@albigdd
        icon: fab fa-mastodon
        desc: Alexander auf Mastodon
      - name: Kontakt per Email
        url: mailto:alexander@bigga.de
        icon: fa fa-envelope
        desc: Discuss development issues around the project
